<script>
var u = new URLSearchParams(location.search).get('u') || location.pathname.replace(/^\/everlume-health\//,'');
document.getElementById('url').textContent = 'everlumehealth.com/' + u;
var t = {symptoms:'Symptom',conditions:'Condition','life-stages':'Life stage',solutions:'Treatment and service',prevention:'Prevention','learning-center':'Article','patient-guide':'Patient guide',locations:'Location landing',about:'About and provider profile'};
document.getElementById('tpl').textContent = (t[u.split('/')[0]] || 'matching') + (t[u.split('/')[0]] ? ' page' : '');
